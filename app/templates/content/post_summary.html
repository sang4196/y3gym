{% load public_dates %}<article><p>{% if post.category == 'notice' %}공지사항{% else %}이벤트{% endif %} · <time datetime="{{ post.published_at }}">{{ post.published_at|seoul_date }}</time></p>
<h2><a href="{{ post.detail_path }}">{{ post.title }}</a></h2>
{% if post.cover_image %}<img src="{{ post.cover_image.url }}" alt="{{ post.cover_image.alt }}" width="{{ post.cover_image.width }}" height="{{ post.cover_image.height }}">{% endif %}</article>
